plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.ai.relay.arpl'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ai.relay.arpl'
        minSdk 26
        targetSdk 35
        versionCode 21000
        versionName (project.findProperty('aiRelayVersion') ?: '2.1.0').toString()
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["$buildDir/generated/jniLibs"]
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
